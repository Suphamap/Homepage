        }
    </script>
    <script>
        function toggleMobileMenu() {
            const mobileNav = document.getElementById('mobileNav');
            mobileNav.classList.toggle('show');
        }
        
        // Close mobile menu when clicking outside
        document.addEventListener('click', function(event) {
            const mobileNav = document.getElementById('mobileNav');
            const hamburgerButton = document.querySelector('.hamburger-menu');
            
            if (mobileNav && hamburgerButton && 
                !mobileNav.contains(event.target) && 
                !hamburgerButton.contains(event.target) && 
                mobileNav.classList.contains('show')) {
                mobileNav.classList.remove('show');
            }
        });
    </script>
</head>
<body>
    <header class="banner container-fluid">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="text-center fw-bold fs-4 m-0">My Homepage</h1>

            </nav>
            
            <!-- Mobile Hamburger Menu Button -->
            <button class="hamburger-menu" onclick="toggleMobileMenu()" aria-label="Toggle menu">
                ☰
            </button>
            
            <!-- Mobile Navigation Menu -->
            <nav class="mobile-nav" id="mobileNav">
                <a href="index.html">Home</a>
                <a href="autobiography.html">Autobiography</a>
                <a href="me-or-not-me.html">Me or Not Me?</a>
                <a href="contact.html">Contact</a>
                <button onclick="searchIcon(event)" aria-label="Search">🔍 Search</button>
            </nav>
        </div>
    </header>
    <main class="container mt-4">

        <img src="me.png" alt="Profile Picture" class="rounded-image-main img-fluid">
        <h3 class="fw-bold mt-4">Introduction</h3>
        <p class="mt-3">Hello, My name is Sydney. Welcome to My Homepage! This is a place where you can learn more about me and my journey. Enjoy exploring!</p>
    </main>
